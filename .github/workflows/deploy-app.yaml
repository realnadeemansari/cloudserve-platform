name: Deploy App

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

env:
    PROJECT_PREFIX: csp-sbx
    AWS_REGION: us-east-1
    ECR_REPOSITORY: csp-sbx-repository
    ECS_CLUSTER: csp-sbx-ecs-cluster
    ECS_SERVICE: csp-sbx-ecs-service
    ECS_TASK_DEFINITION: csp-sbx-ecs-task-definition
    CONTAINER_NAME: csp-sbx-container
    APP_PATH: ${{ github.workspace }}/application

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: aws-actions/configure-aws-credentials@v4
            with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}    
                aws-region: ${{ env.AWS_REGION }}
          - uses: aws-actions/amazon-ecr-login@v2
          - name: Check if image already exists
            id: check-image
            run: |
                if aws ecr describe-images \
                    --repository-name "$ECR_REPOSITORY" \
                    --image-ids imageTag="${{ github.sha }}" \
                    --region "$AWS_REGION" > /dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                    echo "Image ${{ github.sha }} already exists in ECR. Skipping build and push."
                else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                    echo "Image ${{ github.sha }} does not exist. Building and pushing."
                fi
          - name: Build Docker image
            if: steps.check-image.outputs.exists == 'false'
            run: |
                docker build -t $ECR_REPOSITORY:${{ github.sha }} ${{ env.APP_PATH }}
          - name: Tag Docker image
            if: steps.check-image.outputs.exists == 'false'
            run: |
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                docker tag $ECR_REPOSITORY:${{ github.sha }} $ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}
          - name: Push Docker image to ECR
            if: steps.check-image.outputs.exists == 'false'
            run: |
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                docker push $ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}
          - name: Download Task Definition
            run: |
                aws ecs describe-task-definition \
                    --task-definition ${{ env.ECS_TASK_DEFINITION }} \
                    --query taskDefinition \
                    > task-definition.json
          - name: Update Image
            uses: aws-actions/amazon-ecs-render-task-definition@v1
            id: login-ecr
            with: 
                task-definition: task-definition.json
                container-name: ${{ env.CONTAINER_NAME }}
                image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          - name: Deploy
            uses: aws-actions/amazon-ecs-deploy-task-definition@v2
            with: 
                task-definition: ${{ steps.login-ecr.outputs.task-definition }}
                service: ${{ env.ECS_SERVICE }}
                cluster: ${{ env.ECS_CLUSTER }}
                wait-for-service-stability: true