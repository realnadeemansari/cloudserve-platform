name: App EKS Deploy

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

env:
    PROJECT_PREFIX: csp-sbx
    AWS_REGION: us-east-1
    ECR_REPOSITORY: csp-sbx-repository
    EKS_CLUSTER: csp-sbx-eks-cluster
    K8S_NAMESPACE: csp-sbx-eks-namespace
    K8S_DEPLOYMENT: csp-sbx-eks-deployment
    CONTAINER_NAME: csp-sbx-container
    APP_PATH: ${{ github.workspace }}/application

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
                ref: sbx
                fetch-depth: 1
          - name: Get Deployment Commit
            id: commit
            run: |
                COMMIT_SHA=$(git rev-parse HEAD)
                echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
                echo "Deployment commit SHA: $COMMIT_SHA"
          - uses: aws-actions/configure-aws-credentials@v4
            with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}    
                aws-region: ${{ env.AWS_REGION }}
          - name: Login to ECR
            id: login-ecr
            uses: aws-actions/amazon-ecr-login@v2
          - name: Check if image already exists
            id: check-image
            run: |
                if aws ecr describe-images \
                    --repository-name "$ECR_REPOSITORY" \
                    --image-ids imageTag="${{ steps.commit.outputs.sha }}" \
                    --region "$AWS_REGION" > /dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                    echo "Image ${{ steps.commit.outputs.sha }} already exists in ECR. Skipping build and push."
                else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                    echo "Image ${{ steps.commit.outputs.sha }} does not exist. Building and pushing."
                fi
          - name: Build Docker image
            if: steps.check-image.outputs.exists == 'false'
            run: |
                docker build -t $ECR_REPOSITORY:${{ steps.commit.outputs.sha }} ${{ env.APP_PATH }}
          - name: Tag Docker image
            if: steps.check-image.outputs.exists == 'false'
            run: |
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                docker tag $ECR_REPOSITORY:${{ steps.commit.outputs.sha }} $ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:${{ steps.commit.outputs.sha }}
          - name: Push Docker image to ECR
            if: steps.check-image.outputs.exists == 'false'
            run: |
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                docker push $ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:${{ steps.commit.outputs.sha }}
          - name: Setup kubectl
            uses: azure/setup-kubectl@v4
            with:
                version: 'latest'
          - name: Update kubernetes application deployment
            run: |
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                IMAGE_URI="$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:${{ steps.commit.outputs.sha }}"
                echo "Updating Kubernetes deployment with image: $IMAGE_URI"
                aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION
                kubectl set image deployment/$K8S_DEPLOYMENT $CONTAINER_NAME=$IMAGE_URI -n $K8S_NAMESPACE
          - name: Verify deployment rollout status
            run: |
                echo "Verifying deployment rollout status..."
                kubectl rollout status deployment/$K8S_DEPLOYMENT -n $K8S_NAMESPACE
          