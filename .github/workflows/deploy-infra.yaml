name: CDK Deploy
on:
  workflow_dispatch:
permissions:
    contents: read
    id-token: write
jobs:
    cdk-diff:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
            - name: Debug Role ARN
              env:
                AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
              run: |
                if [ -z "$AWS_ROLE_ARN" ]; then
                  echo "AWS_ROLE_ARN is EMPTY or NOT AVAILABLE"
                  exit 1
                else
                  echo "AWS_ROLE_ARN secret is available"
                  echo "Role ARN length: ${#AWS_ROLE_ARN}"
                  echo "Role ARN prefix: ${AWS_ROLE_ARN:0:68}..."
                fi
            - name: Debug GitHub OIDC
              run: |
                echo "Repository: $GITHUB_REPOSITORY"
                echo "Ref: $GITHUB_REF"
                echo "Branch: $GITHUB_REF_NAME"
                echo "Event: $GITHUB_EVENT_NAME"
                echo "Workflow: $GITHUB_WORKFLOW"
                echo "Environment: sbx"
            - name: Debug OIDC Token Claims
              uses: actions/github-script@v7
              with:
                script: |
                  const token = await core.getIDToken('sts.amazonaws.com');
                  const payload = JSON.parse(
                    Buffer.from(token.split('.')[1], 'base64url').toString()
                  );

                  console.log("OIDC issuer:", payload.iss);
                  console.log("OIDC audience:", payload.aud);
                  console.log("OIDC subject:", payload.sub);
                  console.log("OIDC repository:", payload.repository);
                  console.log("OIDC ref:", payload.ref);
                  console.log("OIDC environment:", payload.environment);
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                aws-region: us-east-1
            - name: Verify Identity
              run: |
                    aws sts get-caller-identity
            - name: Install AWS CDK
              run: npm install -g aws-cdk
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: 3.11
            
            - name: Install Dependencies
              working-directory: .
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            - name: CDK Diff
              env:
                AWS_REGION: us-east-1
              working-directory: .
              run: cdk diff
    deploy:
        needs: cdk-diff
        runs-on: ubuntu-latest
        environment:
            name: sbx
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                aws-region: us-east-1
            - name: Install AWS CDK
              run: npm install -g aws-cdk
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: 3.11
            
            - name: Install Dependencies
              working-directory: .
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            - name: CDK Deploy
              env:
                AWS_REGION: us-east-1
              working-directory: .
              run: cdk deploy --all --require-approval never